name: JobSpy Internship Tracker

on:
  schedule:
    # 仅工作日(周一至周五) UTC 时间 08:00 运行一次
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install python-jobspy pandas gspread oauth2client requests

      - name: Run JobSpy Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: python main.py
